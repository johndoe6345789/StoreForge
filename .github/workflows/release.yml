name: Release

# Every commit to main builds and tests StoreForge, then publishes it as a GitHub release
# (tag v1.0.<run number>, with StoreForge.apk attached).
#
# Each run signs the APK with a new self-signed key generated on the runner, so no signing
# secrets are needed. Android only updates an app when the signing key matches, which means an
# APK from one release can't be installed over an APK from another without uninstalling first.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate signing key and compute version
        run: |
          # The keystore and its passwords live only on this runner and are never published.
          STORE_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$STORE_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/release.jks"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" \
            -alias storeforge -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=StoreForge"
          {
            echo "STOREFORGE_KEYSTORE=$KEYSTORE"
            echo "STOREFORGE_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "STOREFORGE_KEY_ALIAS=storeforge"
            echo "STOREFORGE_KEY_PASSWORD=$STORE_PASSWORD"
            # Every release gets a higher number than the last.
            echo "VERSION_CODE=$GITHUB_RUN_NUMBER"
            echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed APK
        run: ./gradlew --no-daemon assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SUBJECT="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)"
          cp app/build/outputs/apk/release/app-release.apk StoreForge.apk
          sed 's/^ *//' > notes.md <<NOTES
          Built from [\`$SHORT_SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA): $SUBJECT

          **Install:** download \`StoreForge.apk\` below on your phone and open it.

          **Updating:** this release is signed with a new key, so Android won't install it over an
          older StoreForge. Uninstall the old one first.

          Android 8.0+ · built against Android 16 (API 36).
          NOTES
          gh release create "v$VERSION_NAME" StoreForge.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "StoreForge $VERSION_NAME" \
            --notes-file notes.md \
            --latest
