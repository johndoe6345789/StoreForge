name: Release

# Push a tag like v1.2.0 to build a signed APK and publish it on the Releases page.
# Installed copies of StoreForge pick the new version up from there as an update.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.STOREFORGE_KEYSTORE_BASE64 }}
      STOREFORGE_KEYSTORE_PASSWORD: ${{ secrets.STOREFORGE_KEYSTORE_PASSWORD }}
      STOREFORGE_KEY_ALIAS: ${{ secrets.STOREFORGE_KEY_ALIAS }}
      STOREFORGE_KEY_PASSWORD: ${{ secrets.STOREFORGE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version and signing key
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Tag must look like v1.2.3 (minor and patch below 100), got $GITHUB_REF_NAME"
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STOREFORGE_KEYSTORE_PASSWORD" ] || [ -z "$STOREFORGE_KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing. See 'Publishing a release' in README.md."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "STOREFORGE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease -PversionName="$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fixed asset name keeps .../releases/latest/download/StoreForge.apk a stable install link
          # and matches the "asset" pattern in apps.json.
          cp app/build/outputs/apk/release/app-release.apk StoreForge.apk
          gh release create "$GITHUB_REF_NAME" StoreForge.apk \
            --title "StoreForge $VERSION" \
            --generate-notes
