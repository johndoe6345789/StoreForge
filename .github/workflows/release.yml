name: Release

# Every commit to main builds and tests StoreForge, then publishes it as a GitHub release
# (tag v1.0.<run number>, with StoreForge.apk attached). Installed copies pick the new
# version up from there as an update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.STOREFORGE_KEYSTORE_BASE64 }}
      STOREFORGE_KEYSTORE_PASSWORD: ${{ secrets.STOREFORGE_KEYSTORE_PASSWORD }}
      STOREFORGE_KEY_ALIAS: ${{ secrets.STOREFORGE_KEY_ALIAS }}
      STOREFORGE_KEY_PASSWORD: ${{ secrets.STOREFORGE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing key and compute version
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STOREFORGE_KEYSTORE_PASSWORD" ] || [ -z "$STOREFORGE_KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing. See 'Publishing releases' in README.md."
            exit 1
          fi
          # Every release gets a higher number than the last, so each one installs over the previous.
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "STOREFORGE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed APK
        run: ./gradlew --no-daemon assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SUBJECT="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)"
          cp app/build/outputs/apk/release/app-release.apk StoreForge.apk
          sed 's/^ *//' > notes.md <<NOTES
          Built from [\`$SHORT_SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA): $SUBJECT

          **Install:** download \`StoreForge.apk\` below on your phone and open it.
          Each release installs over the previous one.

          Android 8.0+ · built against Android 16 (API 36).
          NOTES
          gh release create "v$VERSION_NAME" StoreForge.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "StoreForge $VERSION_NAME" \
            --notes-file notes.md \
            --latest
